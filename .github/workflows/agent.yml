name: Autonomous Dev Agent
run-name: ${{ inputs.phase0 == 'true' && 'Phase 0 — Architect run' || inputs.source == 'scheduler' && 'Scheduled by AppYard' || github.workflow }}

# Runs one agent session every hour; also startable from the Actions tab.
# Claude subscription limits are a rolling window, so this checks hourly rather
# than guessing a reset time: run.sh exits cleanly on a genuine usage-limit
# rejection and the next check after the window resets does the work.
#
# Repo variables used (Settings > Secrets and variables > Actions > Variables):
#   AGENT_TZ          time zone for every timestamp and the daily-log filename (default UTC)
#   AGENT_GIT_NAME    commit author name  (default github-actions[bot])
#   AGENT_GIT_EMAIL   commit author email
#   AGENT_MAIN_BRANCH branch the agent works on (default main)
#   SLACK_WORKFLOW_LINK  link to the Slack reply form, added to "blocked" messages
on:
  schedule:
    - cron: "0 * * * *"
  # Also started by the AppYard scheduler (the dashboard's /api/cron/tick), which
  # follows the Schedule settings and passes source=scheduler; "Run now" and the
  # Actions tab leave it as manual.
  workflow_dispatch:
    inputs:
      source:
        description: "Who started it (the AppYard scheduler sets 'scheduler')"
        required: false
        default: manual
      phase0:
        description: "true for an architect-only run that reads PRD.md and generates the initial tickets"
        required: false
        default: "false"

# Two sessions never overlap; a manual trigger waits for the scheduled one.
concurrency:
  group: autonomous-agent
  cancel-in-progress: false

# The agent commits and pushes its own work.
permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # hard safety cap for this job (well under GitHub's 6h max)
    outputs:
      app_changed: ${{ steps.app_diff.outputs.changed }}
    env:
      TZ: ${{ vars.AGENT_TZ || 'UTC' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Without a branch name, checkout resolves the commit at TRIGGER time. A
          # run queued behind the concurrency group then works on a stale tree and
          # its push conflicts with work merged meanwhile (DAS-X, 2026-09-22). A
          # branch name resolves the tip when this step actually runs.
          ref: ${{ vars.AGENT_MAIN_BRANCH || 'main' }}
          fetch-depth: 0

      - name: Capture starting commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/mobile/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        if: runner.name != vars.AGENT_RUNNER_NAME
        env:
          NODE_OPTIONS: --max-old-space-size=512
        run: npm install -g @anthropic-ai/claude-code --force

      # Remove if the devops role does not deploy to Vercel.
      - name: Install Vercel CLI
        if: runner.name != vars.AGENT_RUNNER_NAME
        env:
          NODE_OPTIONS: --max-old-space-size=512
        run: npm install -g vercel --force

      - name: Configure git identity for agent commits
        run: |
          git config --global user.name "${{ vars.AGENT_GIT_NAME || 'github-actions[bot]' }}"
          git config --global user.email "${{ vars.AGENT_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}"

      - name: Run the agent session
        env:
          # Subscription auth (Pro/Max), generated locally via `claude setup-token`.
          # For API billing, swap this line for
          #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Nothing else changes.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WORKFLOW_LINK: ${{ vars.SLACK_WORKFLOW_LINK }}
          INPUT_PHASE0: ${{ inputs.phase0 || 'false' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # notify.sh reads the latest GitHub Release for the footer link via `gh`.
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x run.sh notify.sh
          ./run.sh

      - name: Upload run logs as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14

      # Did this run change the app? Pushes made with GITHUB_TOKEN do not trigger
      # other workflows, so a preview deploy has to be called from here (below).
      # Set APP_PATH to the app's folder.
      - name: Check if the app changed this run
        id: app_diff
        env:
          APP_PATH: apps/
        run: |
          if git diff --name-only "${{ steps.before.outputs.sha }}" HEAD -- "$APP_PATH" ':(exclude)*.md' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Optional: deploy after any run that changed the app. Add your own deploy
  # workflow with `on: workflow_call` (and `actions/checkout` with `ref: main`,
  # since github.sha is the commit this run started on) and uncomment. Its own
  # `on: push` trigger will never fire for the agent's pushes. Same pattern for
  # server functions: DAS-X calls deploy-functions.yml when supabase/functions/ changed.
  # preview:
  #   needs: run-agent
  #   if: needs.run-agent.outputs.app_changed == 'true'
  #   uses: ./.github/workflows/preview.yml
  #   secrets: inherit
