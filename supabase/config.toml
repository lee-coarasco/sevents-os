# Local Supabase CLI config (minimal — the Supabase CLI was not available in
# this session; this file matches what `supabase init` would generate so
# the CLI can be installed and run against this project without redoing
# the scaffold). Real project credentials live in GitHub Actions secrets
# (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY) per
# CLAUDE.md, never in this file.

project_id = "sevents-os"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
